name: Export Amamiya image assets for Drive
on:
  push:
    paths:
      - .github/workflows/export-amamiya-assets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Upload original image assets
        uses: actions/upload-artifact@v4
        with:
          name: amamiyarui-original-images
          path: 06_IMAGES/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
